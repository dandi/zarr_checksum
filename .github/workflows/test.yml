name: Run Tests
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  lock-file-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Check poetry lock file
        run: poetry check --lock
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        toxenv: [test]
        include:
          - python-version: "3.10"
            toxenv: lint
          - python-version: "3.10"
            toxenv: typing
          - python-version: "3.10"
            toxenv: codespell
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        if: matrix.toxenv == 'test'
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioAccessKey \
            -e MINIO_ROOT_PASSWORD=minioSecretKey \
            ghcr.io/coollabsio/minio:latest \
            server /data
          # Wait for minio to be ready
          for i in {1..30}; do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: |
          pip install --upgrade pip
          pip install tox
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioAccessKey
          MINIO_SECRET_KEY: minioSecretKey
